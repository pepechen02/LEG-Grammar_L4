var Q = {"A": [{"q": "What does his¹ refer to?", "opts": ["my brother Samuel", "my grandfather", "our teacher", "the class"], "a": 0, "ex": "his 是所有格形容詞，指前面的擁有者 my brother Samuel（他討厭「他自己的」名字）。"}, {"q": "What does him² refer to?", "opts": ["the teacher", "my father", "Samuel", "my sister"], "a": 2, "ex": "him 是受格人稱代名詞，作 calls 的受詞，代替前面提過的 Samuel。"}, {"q": "What does it³ refer to?", "opts": ["the name Samuel", "the name Sam", "my brother", "my grandfather"], "a": 0, "ex": "it 指前面剛提到的事物 the name Samuel（這個名字原本是祖父的）。"}, {"q": "What does ours⁴ mean?", "opts": ["our teacher", "our names", "Sam's name", "my parents"], "a": 1, "ex": "所有格代名詞 ours = our + 名詞，這裡等於 our names，所以後面不再接名詞。"}, {"q": "What does their⁵ refer to?", "opts": ["the teachers", "my parents", "my brother and sister", "the students in the class"], "a": 3, "ex": "their 是 they 的所有格形容詞，指 the class（班上的學生們），名詞 names 前面要用所有格形容詞。"}, {"q": "Whose name was Samuel before it was my brother's?", "opts": ["The teacher's", "My grandfather's", "My sister's", "My parents'"], "a": 1, "ex": "原文 it was my grandfather's（= my grandfather's name）。用 Whose 問擁有者，可用所有格 's 回答。"}], "B": [{"q": "Lisa has got a scarf. ___ scarf is pink. That blue scarf isn't ___.", "opts": ["Her … hers", "Hers … her", "She … hers", "Her … her"], "a": 0, "ex": "scarf 前面要用所有格形容詞 Her；isn't 後面沒有名詞，要用所有格代名詞 hers（= her scarf）。"}, {"q": "Tom and I have got a boat. ___ boat is white. That red boat isn't ___.", "opts": ["Our … our's", "Ours … our", "We … ours", "Our … ours"], "a": 3, "ex": "Tom and I = we，所有格形容詞 Our + 名詞；單獨使用時用 ours。ours 沒有撇號。"}, {"q": "I have got a pen. ___ pen is blue. That black pen isn't ___.", "opts": ["My … my", "Mine … my", "My … mine", "Me … mine"], "a": 2, "ex": "I 的所有格形容詞是 my（後接名詞），所有格代名詞是 mine（不接名詞）。"}, {"q": "The twins have got a cat. ___ cat is grey. That brown cat isn't ___.", "opts": ["They … theirs", "Theirs … their", "Their … theirs", "Their … their's"], "a": 2, "ex": "The twins = they，所以用 Their + 名詞、theirs 單獨使用。theirs 沒有撇號。"}, {"q": "You and your sister have got a house. ___ house is big. That small house isn't ___.", "opts": ["Your … yours", "Yours … your", "You … yours", "Your … your's"], "a": 0, "ex": "you 的所有格形容詞是 your，所有格代名詞是 yours。yours 不加撇號（your's 是錯的）。"}, {"q": "My uncle has got a motorbike. ___ motorbike is loud. That quiet motorbike isn't ___.", "opts": ["He … him", "His … his", "Him … his", "His … hers"], "a": 1, "ex": "he 的所有格形容詞和所有格代名詞都是 his，形式相同，但用法不同。"}, {"q": "Whose bag is this? — It's Anna's. It's ___.", "opts": ["her", "hers", "she", "she's"], "a": 1, "ex": "回答 Whose，可以用所有格代名詞。hers = her bag，後面不接名詞，所以不能用 her。"}, {"q": "The dog is wagging ___ tail.", "opts": ["their's", "it's", "it", "its"], "a": 3, "ex": "tail 前面要用所有格形容詞 its（不加撇號）。it's 是 it is 的縮寫。"}], "C": [{"q": "Blank (1)", "opts": ["your", "you", "yours", "me"], "a": 1, "ex": "can 後面要有主詞，對 Mum 說話，所以用主詞人稱代名詞 you。"}, {"q": "Blank (2)", "opts": ["mine", "I", "my", "me"], "a": 3, "ex": "help 的受詞，且在 and 後面接 Ben and ___，用受格 me。"}, {"q": "Blank (3)", "opts": ["we", "ours", "our", "us"], "a": 2, "ex": "project 是名詞，前面用所有格形容詞 our（Mia 和 Ben 的專題）。"}, {"q": "Blank (4)", "opts": ["I", "me", "my", "mine"], "a": 0, "ex": "can't find 前面需要主詞，用主詞人稱代名詞 I。"}, {"q": "Blank (5)", "opts": ["mine", "my", "me", "I"], "a": 1, "ex": "notes 前面要用所有格形容詞 my。mine 後面不能接名詞。"}, {"q": "Blank (6)", "opts": ["he", "his", "him", "her"], "a": 1, "ex": "Ben has lost his (notes). 後面沒有名詞，his 是所有格代名詞，意思是 his notes。"}, {"q": "Blank (7)", "opts": ["you", "your", "yours", "you're"], "a": 2, "ex": "Are these notes yours? 後面沒有名詞，用所有格代名詞 yours（= your notes）。"}, {"q": "Blank (8)", "opts": ["mine", "my", "me", "I"], "a": 0, "ex": "they aren't mine：後面沒有名詞，用 mine（= my notes）。"}, {"q": "Blank (9)", "opts": ["theirs", "they", "their", "them"], "a": 3, "ex": "give 的受詞，指前面的 notes，用受格 them。"}, {"q": "Blank (10)", "opts": ["him", "he", "his", "her"], "a": 0, "ex": "介系詞 to 後面用受格。Ben 是男生，所以是 him。"}], "D": [{"q": "Jack has got three sisters. They are friendly.", "opts": ["Jack's sisters are friendly.", "Jacks' sisters are friendly.", "The Jack's sisters are friendly.", "Jack sisters' are friendly."], "a": 0, "ex": "單數名詞加 's，且所有格後面的名詞不加冠詞（不能寫 The Jack's）。"}, {"q": "The girls have got bikes. They are new.", "opts": ["The girl's bikes are new.", "The girls' bikes are new.", "The girls's bikes are new.", "The bikes' girls are new."], "a": 1, "ex": "girls 是規則複數（本來就有 s），只加撇號 '，變成 girls'。"}, {"q": "The women have got a car. It is red.", "opts": ["The women's car is red.", "The womens' car is red.", "The womans car is red.", "The women' car is red."], "a": 0, "ex": "women 是不規則複數（沒有 s 結尾），要加 's。"}, {"q": "The room has got windows. They are dirty.", "opts": ["The windows' room are dirty.", "The room windows' are dirty.", "The windows of the room are dirty.", "The windows of the room's are dirty."], "a": 2, "ex": "room 是事物（非人或動物），表示所有時用 of + 名詞：the windows of the room。"}, {"q": "Ben and Jill have got a flat. It is cheap.", "opts": ["Ben and Jills' flat is cheap.", "Ben's and Jill's flat is cheap.", "Ben and Jill's flat is cheap.", "Ben and Jill flat's is cheap."], "a": 2, "ex": "兩人共有同一個東西（a flat），只在最後一個擁有者加 's。"}, {"q": "Tina has got a phone and Paul has got a phone. They are expensive.", "opts": ["Tina's and Paul phones are expensive.", "Tinas' and Pauls' phones are expensive.", "Tina and Paul's phone is expensive.", "Tina's and Paul's phones are expensive."], "a": 3, "ex": "兩人各有各的東西（兩支手機），每個擁有者都要加 's。"}, {"q": "James has got a dog. It is friendly.", "opts": ["James dog is friendly.", "James's dog is friendly.", "The dog's James is friendly.", "Of James dog is friendly."], "a": 1, "ex": "以 -s 結尾的專有名詞可加 's 或 '（James's / James'）。擁有者放在被擁有者前面。"}, {"q": "The film has got an end. It is sad.", "opts": ["The end film is sad.", "The end of the film are sad.", "The end of film's is sad.", "The end of the film is sad."], "a": 3, "ex": "film 是事物，用 of + 名詞：the end of the film。主詞 end 是單數，動詞用 is。"}], "E": [{"q": "Dan wants a magazine and a newspaper. He's at the ___.", "opts": ["newsagent'", "newsagents", "newsagent", "newsagent's"], "a": 3, "ex": "newsagent's = newsagent's shop（書報攤），店名省略 shop，只留所有格 's。"}, {"q": "Mrs Lee needs some medicine for a cold. She's at the ___.", "opts": ["chemist's", "butcher's", "baker's", "chemists"], "a": 0, "ex": "chemist's（藥局）賣藥品。butcher's 賣肉，baker's 賣麵包。"}, {"q": "Kate wants to have her hair cut. She's at the ___.", "opts": ["greengrocer's", "hairdresser's", "chemist's", "hairdressers"], "a": 1, "ex": "hairdresser's = 美髮店。看到店名要記得有 's。"}, {"q": "Tom wants some sausages and lamb. He's at the ___.", "opts": ["greengrocer's", "baker's", "butcher's", "butchers"], "a": 2, "ex": "butcher's（肉店）賣香腸和羊肉。"}, {"q": "Mum wants some apples and onions. She's at the ___.", "opts": ["newsagent's", "greengrocer's", "baker's", "greengrocers'"], "a": 1, "ex": "greengrocer's（蔬果店）賣水果和蔬菜。"}, {"q": "Lucy is buying a loaf of bread and some rolls. She's at the ___.", "opts": ["baker's", "butcher's", "chemist's", "bakers"], "a": 0, "ex": "baker's（麵包店）賣麵包。"}], "F": [{"q": "Blank (1)", "opts": ["I", "me", "mine", "my"], "a": 3, "ex": "best friend 是名詞，前面用所有格形容詞 my。"}, {"q": "Blank (2)", "opts": ["she's", "hers", "her", "him"], "a": 2, "ex": "house 前面用所有格形容詞 her（Emma 的房子）。hers 後面不能接名詞。"}, {"q": "Blank (3)", "opts": ["Emma's", "Emmas'", "Emma", "Her's"], "a": 0, "ex": "Emma 是單數專有名詞，所有格加 's；後面接 garden，不加冠詞。"}, {"q": "Blank (4)", "opts": ["much", "a little", "a few", "every"], "a": 2, "ex": "apple trees 是可數複數名詞，用 a few（有一些）。a little 修飾不可數名詞。"}, {"q": "Blank (5)", "opts": ["many", "much", "a few", "every"], "a": 1, "ex": "time 是不可數名詞，否定句用 much。many 和 a few 修飾可數名詞。"}, {"q": "Blank (6)", "opts": ["every", "any", "some", "no"], "a": 0, "ex": "every Saturday = 每個星期六，every 後面接單數名詞。"}, {"q": "Blank (7)", "opts": ["every", "some", "no", "any"], "a": 3, "ex": "hasn't got 已經是否定，後面用 any（not ... any）。"}, {"q": "Blank (8)", "opts": ["they", "them", "their", "theirs"], "a": 1, "ex": "lend 的受詞，指前面的 comics，用受格 them。"}, {"q": "Blank (9)", "opts": ["her", "she", "hers", "his"], "a": 0, "ex": "like 的受詞，指 Emma，用受格 her。"}]};

const renderDiagram = dg => '';
const notesHTML = () => "<div class=\"nt\"><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">01</span><div><h3>Pronoun Table</h3><div class=\"kz\">人稱代名詞總表</div></div></div><div class=\"tw\"><table><tr><th>Subject<small>主格</small></th><th>Object<small>受格</small></th><th>Possessive adj.<small>所有格形容詞</small></th><th>Possessive pron.<small>所有格代名詞</small></th></tr>\n<tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr>\n<tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr>\n<tr><td>he</td><td>him</td><td>his</td><td>his</td></tr>\n<tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr>\n<tr><td>it</td><td>it</td><td>its</td><td>—</td></tr>\n<tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr>\n<tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr>\n<tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr></table></div></section><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">02</span><div><h3>Object Personal Pronouns</h3><div class=\"kz\">受格人稱代名詞</div></div></div><ul><li>Use them <b>after verbs</b> (as objects) or <b>after prepositions</b>. 放在動詞或介系詞後面當受詞。\n<div class=\"ex\">We saw <b>them</b> at the cinema. · Is he talking to <b>you</b>?</div></li></ul></section><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">03</span><div><h3>Possessive Adjectives</h3><div class=\"kz\">所有格形容詞</div></div></div><ul><li>They go <b>before a noun</b> and never take an article (a / the). 一定放在名詞前，前面不加冠詞。\n<div class=\"ex\"><b>Your</b> house is big. ✗ the your house</div></li>\n<li>They agree with the <b>possessor</b> (owner), not with the thing owned. 性別和數量跟擁有者一致。\n<div class=\"ex\">She is a student. <b>Her</b> desk is here. · They are teachers. <b>Their</b> books are on the desk.</div></li>\n<li><b>its</b> (no apostrophe) = belonging to it; <b>it's</b> = it is / it has. its 沒有撇號。\n<div class=\"ex\">The dog is wagging <b>its</b> tail.</div></li></ul></section><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">04</span><div><h3>Possessive Pronouns</h3><div class=\"kz\">所有格代名詞</div></div></div><ul><li>Used <b>instead of</b> possessive adjective + noun, so they are <b>never followed by a noun</b>. 代替「所有格形容詞＋名詞」，後面不接名詞。\n<div class=\"ex\">That's her pet. → That's <b>hers</b>. · That car isn't <b>ours</b>.</div></li>\n<li>No apostrophe: yours, ours, hers, theirs. 都不加撇號。</li></ul></section><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">05</span><div><h3>Possessive Case ('s)</h3><div class=\"kz\">所有格</div></div></div><p>Shows that something belongs to a <b>person or an animal</b>. 表示人或動物擁有某物。</p>\n<div class=\"tw\"><table><tr><th>Rule<small>規則</small></th><th>Example<small>例句</small></th></tr>\n<tr><td>Singular noun + <b>'s</b></td><td>This is the girl<b>'s</b> T-shirt.</td></tr>\n<tr><td>Regular plural + <b>'</b></td><td>The babies<b>'</b> hands are small.</td></tr>\n<tr><td>Irregular plural + <b>'s</b></td><td>The women<b>'s</b> dresses are short.</td></tr>\n<tr><td>Name ending in -s: <b>'s</b> or <b>'</b></td><td>This is James<b>'s</b> / James<b>'</b> house.</td></tr></table></div>\n<ul><li><b>Same thing, shared</b> → add 's to the last owner only. 共有同一物，只在最後一個加。\n<div class=\"ex\">Mike and Helen<b>'s</b> car is new. (one car)</div></li>\n<li><b>Different things</b> → add 's to each owner. 各有各的，每個都加。\n<div class=\"ex\">Mike<b>'s</b> and Helen<b>'s</b> cars are new. (two cars)</div></li>\n<li>Omit the noun if it was <b>already mentioned</b>, is obvious, or is a <b>place (shop)</b>. 前面提過、不言而喻或指店家時，可省略名詞。\n<div class=\"ex\">It's Judy<b>'s</b> (book). · Where are you going? — To the newsagent<b>'s</b>.</div></li>\n<li>Answering <b>Whose ...?</b> 回答 Whose 的問句：\n<div class=\"ex\">Whose is this pen? — It's <b>mine</b>. · Whose box is this? — It's <b>Diana's</b>.</div></li></ul></section><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">06</span><div><h3>of + noun</h3><div class=\"kz\">事物的所有</div></div></div><ul><li>For <b>things</b> (not people or animals) and abstract nouns, use <b>of + noun</b>. 事物或抽象名詞用 of。\n<div class=\"ex\">the colour <b>of</b> this T-shirt · the front door <b>of</b> the house</div></li></ul></section><section class=\"kc\"><div class=\"kh\"><span class=\"kn\">07</span><div><h3>Shop Names</h3><div class=\"kz\">店家名稱</div></div></div><ul><li>the <b>baker's</b> 麵包店 · the <b>butcher's</b> 肉店 · the <b>greengrocer's</b> 蔬果店 · the <b>newsagent's</b> 書報攤 · the <b>chemist's</b> 藥局 · the <b>hairdresser's</b> 美髮店</li></ul></section></div>";

const ptsOf = qs => qs.reduce((a,q)=>a+q.pts,0);

const load = (k,d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const save = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const shuffleQ = q => {
  if(!CFG.shuffle || q.options.length < 3) return q;
  const idx = q.options.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return {...q, options: idx.map(i=>q.options[i]), ans: idx.indexOf(q.ans)};
};

function SegBar({parts, flat, st, idx}) {
  const curId = flat[idx] && flat[idx].sec.id;
  return (
    <div className="flex gap-1.5" role="progressbar" aria-valuemin="0" aria-valuemax={flat.length}
         aria-valuenow={flat.filter(x => st[x.q.id] && st[x.q.id].checked).length}>
      {parts.map(p => {
        const done = p.qs.filter(q => st[q.id] && st[q.id].checked).length;
        const cur = curId === p.sec.id;
        return (
          <div key={p.sec.id} style={{flex: p.qs.length}} className="min-w-0">
            <div className="h-2.5 overflow-hidden rounded-full bg-soft">

function Quiz({session, onHome, onRecord, onFinish, onNotes}) {

  const cur = flat[idx]; const q = cur.q, sec = cur.sec, s = st[q.id] || {};

  const patch = (id,o) => setSt(prev => ({...prev, [id]: {...(prev[id]||{}), ...o}}));
  const pickMC = i => {
    if(s.checked) return;
    const status = i===q.ans ? 'right' : 'wrong';
    patch(q.id, {checked:true, status, pts: status==='right' ? q.pts : 0, value:q.options[i], pick:i});
    onRecord(q, status, q.options[i]);

  useEffect(() => { try { window.scrollTo({top:0}); } catch(e){} }, [idx, fin]);
  useEffect(() => {
    if(!s.checked) return;
    const t = setTimeout(() => { try { nextRef.current && nextRef.current.focus({preventScroll:true}); } catch(e){} }, 150);
    return () => clearTimeout(t);
  }, [s.checked, idx]);

  if(fin) {
    const g = CFG.gradeOf(score,total);
    const pct = Math.round(score/total*100);

            <span className="text-left leading-tight"><span className="block font-display text-lg font-extrabold">{g.name}</span><span className="text-sm font-medium">{g.zh}</span></span>

            {[['100%',score===total],['99-90%',pct>=90&&score<total],['89-80%',pct>=80&&pct<90],['79-70%',pct>=70&&pct<80],['Below 69%',pct<70]].map(([l,on]) =>
              <div key={l} className={'rounded-lg border px-1 py-1.5 ' + (on ? 'border-accent bg-accentsoft font-bold text-accenttext' : 'border-line bg-card')}>{l}</div>)}
          </div></div>
        </div>

        <div className="mt-5 rounded-2xl border border-line bg-card p-5">
          <h2 className="font-display text-lg font-extrabold">各單元得分</h2>
          <div className="mt-3 flex flex-col gap-3">
            {parts.map(p => {
              const got = p.qs.reduce((a,q) => a + ((st[q.id]&&st[q.id].pts)||0), 0), tot = ptsOf(p.qs);

        <div className="rise mb-3 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-bad bg-badsoft p-3 text-sm">
          <span className="text-ink">確定要離開嗎？目前的作答進度不會保留。</span>
          <span className="flex gap-2"><Btn kind="ghost" className="!px-3 !py-1.5 text-sm" onClick={() => setLeaving(false)}>繼續作答</Btn><Btn className="!px-3 !py-1.5 text-sm" onClick={onHome}>離開</Btn></span>
        </div>
      )}

      <div key={q.id} className="rise rounded-3xl border border-line bg-card p-5 sm:p-7">
        <div className="mb-4 flex flex-wrap items-center gap-2">
          <Chip className="bg-primarysoft text-primary">{sec.code}</Chip>
          <span className="text-sm font-semibold">{sec.zh}</span>
          <span className="text-sm text-muted">· Q{q.no} · {q.pts} 分</span>
          <LvChip lv={q.lv}/>
        </div>
        <p className="mb-4 text-sm italic text-muted">{sec.dir}</p>
        {sec.pass && <div className="mb-5 whitespace-pre-line rounded-2xl border border-line bg-soft p-4 text-[15px] leading-7">{sec.pass}</div>}

        {q.dg && (
          <div className="mb-5 text-center">
            <div className="diagbox mx-auto" dangerouslySetInnerHTML={{__html: renderDiagram(q.dg)}}/>
            <div className="mt-2 font-mono text-xs tracking-wide text-muted">{CFG.diagCaption}</div>
          </div>
        )}

        <p className="text-xl font-medium leading-snug break-words">{q.q}</p>

        <div className="mt-5 flex flex-col gap-2.5">
          {q.options.map((o,i) => {
            const picked = s.pick===i, isAns = i===q.ans;
            let cls = 'border-line bg-card hover:border-primary';
            if(s.checked) cls = isAns ? 'border-good bg-goodsoft' : picked ? 'border-bad bg-badsoft' : 'border-line bg-card opacity-60';
            return (
              <button key={i} onClick={() => pickMC(i)} aria-pressed={picked}
                className={'flex w-full items-start gap-3 rounded-xl border-2 px-4 py-3 text-left transition ' + cls}>
                <span className={'mt-0.5 flex h-7 w-7 shrink-0 items-center justify-center rounded-full border font-mono text-sm font-semibold ' + (s.checked && isAns ? 'border-good bg-good text-card' : s.checked && picked ? 'border-bad bg-bad text-card' : 'border-line')}>{LETTERS[i]}</span>
                <span className="min-w-0 flex-1 break-words leading-snug">{o}</span>
                {s.checked && isAns && <span className="font-bold text-good">✓</span>}
                {s.checked && picked && !isAns && <span className="font-bold text-bad">✕</span>}
              </button>
            );
          })}
        </div>

        {s.checked && <Feedback q={q} s={s}/>}
      </div>

      <div className="mt-5 flex items-center justify-between gap-3">
        <Btn kind="ghost" onClick={() => setIdx(idx-1)} disabled={idx===0}>← 上一題</Btn>
        {s.checked
          ? <Btn kind="accent" onClick={next} ref={nextRef}>{idx<flat.length-1 ? '下一題 →' : '完成，查看成績'}</Btn>
          : <span className="text-sm text-muted">點選一個選項，馬上看結果</span>}
      </div>
    </div>
  );
}

function UnitCard({sec, best, onStart}) {
  const qs = QS[sec.id], b = best[sec.id];
  const bn = qs.filter(q => q.lv==='b').length;
  return (
    <button onClick={onStart} className="flex flex-col gap-3 rounded-2xl border border-line bg-card p-4 text-left transition hover:border-primary active:scale-[.99]">
      <div className="flex items-center justify-between gap-2">
        <Chip className="bg-primarysoft text-primary">{sec.code}</Chip>
        <span className="text-xs text-muted">{sec.tag}</span>
      </div>
      <div className="flex items-start gap-3">
        <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-primarysoft"><Icon name={sec.icon} size={40}/></div>
        <div className="min-w-0">
          <div className="font-display text-lg font-extrabold leading-snug">{sec.en}</div>
          <div className="text-sm text-muted">{sec.desc}</div>
        </div>
      </div>
      <div className="mt-auto flex items-center justify-between text-sm">
        <span className="text-muted">{qs.length} 題{bn>0 && bn<qs.length ? `（基礎 ${bn}／進階 ${qs.length-bn}）` : ''}</span>
        {b ? <span className="font-semibold text-good">最佳 {b.score}/{b.total}</span> : <span className="text-muted">尚未挑戰</span>}
      </div>
    </button>
  );
}

function FullCard({f, best, onStart}) {
  const qs = f.secs.flatMap(s => QS[s]);
  return (
    <section className="rounded-3xl border-2 border-accent bg-card p-5 sm:p-6">
      <div className="flex flex-wrap items-center justify-between gap-4">
        <div className="min-w-0">
          <Chip className="bg-accentsoft text-accenttext">{f.tag}</Chip>
          <h2 className="mt-2 font-display text-2xl font-extrabold">{f.title}</h2>
          <p className="mt-1 text-sm text-muted">{f.desc} · {qs.length} 題 · 共 {ptsOf(qs)} 分</p>
          {best && <p className="mt-1 text-sm font-semibold text-good">最佳成績 {best.score}/{best.total}</p>}
        </div>
        <Btn kind="accent" onClick={onStart}>開始挑戰</Btn>
      </div>
    </section>
  );
}

function Home({best, noteCount, start, openNotes, practiceNotes, openKey}) {
  return (
    <div className="pb-10 pt-6">
      <div className="blueprint relative overflow-hidden rounded-3xl border border-line p-6 sm:p-8">
        <div className="flex items-start justify-between gap-4">
          <div className="min-w-0">
            <Chip className="bg-primarysoft text-primary">{CFG.hero.chip}</Chip>
            <h1 className="mt-3 font-display text-4xl font-extrabold leading-tight sm:text-5xl" style={{textWrap:'balance'}}>{CFG.hero.title}</h1>
            <p className="mt-2 text-muted">{CFG.hero.sub}</p>
          </div>
          <div className="shrink-0"><Mascot/></div>
        </div>
        <p className="mt-5 max-w-lg text-ink">{CFG.hero.intro}</p>
      </div>

      {CFG.keypoints && (
        <button onClick={openKey} className="mt-6 flex w-full items-center gap-4 rounded-2xl border border-line bg-card p-4 text-left transition hover:border-primary active:scale-[.99]">
          <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-accentsoft"><Icon name="notes" size={40}/></div>
          <div className="min-w-0">
            <Chip className="bg-accentsoft text-accenttext">KEY POINTS</Chip>
            <div className="mt-1 font-display text-lg font-extrabold">重點整理</div>
            <div className="text-sm text-muted">英中對照的文法重點與例句，先看再做題</div>
          </div>
        </button>
      )}

      <div className="mt-6 flex flex-col gap-3">
        {FULLS.map(f => <FullCard key={f.key} f={f} best={best[f.key]} onStart={() => start({key:f.key, title:f.title, secs:f.secs})}/>)}
      </div>

      {GROUPS.map(g => (
        <div key={g.tag}>
          <h2 className="mt-8 font-display text-xl font-extrabold">{g.title}</h2>
          <p className="text-sm text-muted">{g.sub}</p>
          <div className="mt-3 grid gap-3 sm:grid-cols-2">
            {g.mods.map(s => <UnitCard key={s} sec={SEC[s]} best={best} onStart={() => start({key:s, title:SEC[s].code + ' ' + SEC[s].en, secs:[s]})}/>)}
          </div>
        </div>
      ))}

      <section className="mt-8 rounded-2xl border border-line bg-card p-5">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div>
            <h2 className="font-display text-xl font-extrabold">錯題筆記</h2>
            <p className="text-sm text-muted">{noteCount>0 ? `目前收藏 ${noteCount} 題，答對後可從筆記移除。` : '還沒有錯題。答錯的題目會自動收進來。'}</p>
          </div>
          <div className="flex gap-2">
            <Btn kind="ghost" onClick={openNotes}>查看筆記</Btn>
            <Btn onClick={practiceNotes} disabled={noteCount===0}>只重練錯題</Btn>
          </div>
        </div>
      </section>
    </div>
  );
}

function KeyPoints({onBack, start}) {
  return (
    <div className="pb-10 pt-6">
      <button onClick={onBack} className="mb-3 rounded-lg px-2 py-1 text-sm font-semibold text-muted hover:text-ink">← 回首頁</button>
      <div className="blueprint rounded-3xl border border-line p-6">
        <Chip className="bg-accentsoft text-accenttext">KEY POINTS</Chip>
        <h1 className="mt-2 font-display text-3xl font-extrabold">重點整理</h1>
        <p className="mt-1 text-muted">先把重點看過一遍，再到首頁挑戰各單元。</p>
      </div>
      <div className="nt mt-4" dangerouslySetInnerHTML={{__html: notesHTML()}}/>
      <h2 className="mt-8 font-display text-xl font-extrabold">看完重點，開始測驗</h2>
      <div className="mt-3 grid gap-3 sm:grid-cols-2">
        {ORDER.map(s => <Btn key={s} kind="ghost" className="!justify-start text-left" onClick={() => start({key:s, title:SEC[s].code + ' ' + SEC[s].en, secs:[s]})}>
          <Icon name={SEC[s].icon} size={30}/><span className="min-w-0 truncate">{SEC[s].code} {SEC[s].en}</span></Btn>)}
      </div>
    </div>
  );
}

function Notebook({notes, onBack, onRemove, onClear, onPractice}) {
  const ids = Object.keys(notes).filter(id => QBY[id]);
  const [confirmClear, setConfirmClear] = useState(false);
  return (
    <div className="pb-10 pt-6">
      <button onClick={onBack} className="mb-3 rounded-lg px-2 py-1 text-sm font-semibold text-muted hover:text-ink">← 回首頁</button>
      <div className="blueprint rounded-3xl border border-line p-6">
        <h1 className="font-display text-3xl font-extrabold">錯題筆記</h1>
        <p className="mt-1 text-muted">共 {ids.length} 題。先讀解析，再按「只重練錯題」。</p>
        <div className="mt-4 flex flex-wrap gap-2">
          <Btn onClick={onPractice} disabled={ids.length===0}>只重練錯題</Btn>
          {!confirmClear
            ? <Btn kind="ghost" onClick={() => setConfirmClear(true)} disabled={ids.length===0}>清空筆記</Btn>
            : <><Btn kind="ghost" onClick={() => setConfirmClear(false)}>取消</Btn><Btn className="!bg-bad" onClick={() => { onClear(); setConfirmClear(false); }}>確定清空</Btn></>}
        </div>
      </div>
      {ids.length===0 && <p className="mt-6 rounded-2xl border border-line bg-card p-5 text-muted">目前沒有錯題。去挑戰一個單元，答錯的題目會自動出現在這裡。</p>}
      {ORDER.map(s => {
        const list = QS[s].filter(q => notes[q.id]);
        if(!list.length) return null;
        return (
          <section key={s} className="mt-7">
            <h2 className="font-display text-lg font-extrabold">{SEC[s].code} <span className="text-base font-semibold text-muted">{SEC[s].zh}</span></h2>
            <div className="mt-3 flex flex-col gap-3">
              {list.map(q => <NoteCard key={q.id} q={q} sec={SEC[s]} yours={notes[q.id].last} count={notes[q.id].n} onRemove={() => onRemove(q.id)}/>)}
            </div>
          </section>
        );
      })}
    </div>
  );
}

function App() {
  const [view, setView] = useState('home');
  const [session, setSession] = useState(null);
  const [notes, setNotes] = useState(() => load(CFG.lsNotes, {}));
  const [best, setBest] = useState(() => load(CFG.lsBest, {}));
  useEffect(() => { save(CFG.lsNotes, notes); }, [notes]);
  useEffect(() => { save(CFG.lsBest, best); }, [best]);

  const begin = (cfg) => {
    const run = (n) => {
      const parts = cfg.secs.map(s => ({ sec:SEC[s], qs: (cfg.only ? QS[s].filter(q => cfg.only[q.id]) : QS[s]).map(shuffleQ) })).filter(p => p.qs.length);
      setSession({ ...cfg, parts, runId:n, retry: () => run(n+1) });
    };
    run(1); setView('quiz');
  };
  const start = (cfg) => begin({ mode:'unit', ...cfg });
  const practiceNotes = () => begin({ key:'notes', title:'錯題重練', mode:'notes', secs:ORDER, only:notes });

  const onRecord = (q, status, yours) => {
    if(status !== 'right') setNotes(n => ({...n, [q.id]: { n:((n[q.id]&&n[q.id].n)||0)+1, last:yours, at:Date.now() }}));
    else if(session && session.mode==='notes') setNotes(n => { const c={...n}; delete c[q.id]; return c; });
  };
  const onFinish = (key, score, total) => {
    if(key==='notes') return;
    setBest(b => (!b[key] || score/total > b[key].score/b[key].total) ? {...b, [key]:{score,total}} : b);
  };
  const removeNote = id => setNotes(n => { const c={...n}; delete c[id]; return c; });
  const count = Object.keys(notes).filter(id => QBY[id]).length;

  if(view==='quiz' && session) return <Quiz key={session.runId + session.key} session={session} onHome={() => setView('home')} onRecord={onRecord} onFinish={onFinish} onNotes={() => setView('notes')}/>;
  if(view==='notes') return <Notebook notes={notes} onBack={() => setView('home')} onRemove={removeNote} onClear={() => setNotes({})} onPractice={practiceNotes}/>;
  if(view==='key') return <KeyPoints onBack={() => setView('home')} start={start}/>;
  return <Home best={best} noteCount={count} start={start} openNotes={() => setView('notes')} practiceNotes={practiceNotes} openKey={() => setView('key')}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>
</body>
</html>
